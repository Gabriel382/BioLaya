seed: 42
model:
  base: convaiinnovations/laya
  output: outputs/biolaya/systemone/final
data:
  train: data/comparable/sprint8/laya_train.jsonl
  dev: data/comparable/sprint8/laya_dev.jsonl
training:
  loss: soft-ce
  epochs: 3
  micro_batch: 4
  grad_accum: 16
  encoder_lr: 2.5e-5
  head_lr: 1.0e-4
  max_len: 1024
  head_max_len: 256
  device: cuda
  shuffle_options: true
  freeze_encoder: false
