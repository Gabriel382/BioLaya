seed: 42
model:
  base: answerdotai/ModernBERT-large
  output: outputs/biolaya/standard/nli4ct
labels: [contradiction, entailment]
data:
  train: data/standard/nli4ct/train.jsonl
  dev: data/standard/nli4ct/dev.jsonl
training:
  epochs: 3
  max_length: 1024
  batch_size: 2
  eval_batch_size: 4
  grad_accum: 16
  learning_rate: 2.0e-5
  bf16: true
  gradient_checkpointing: true
