seed: 42
model:
  # Train general_mnli.yaml first; its checkpoint is the initial stage.
  base: outputs/biolaya/standard/general_mnli/final
  output: outputs/biolaya/standard/biomedical_multinli
labels: [contradiction, entailment, neutral]
data:
  train: data/standard/biomedical_multinli/train.jsonl
  dev: data/standard/biomedical_multinli/dev.jsonl
training:
  epochs: 2
  max_length: 1024
  batch_size: 2
  eval_batch_size: 4
  grad_accum: 16
  learning_rate: 1.0e-5
  bf16: true
  gradient_checkpointing: true
